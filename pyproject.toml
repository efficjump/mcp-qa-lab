[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-qa-lab"
version = "0.1.0"
description = "Evidence-driven protocol and agent-usability testing for MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "efficjump" }]
keywords = ["mcp", "model-context-protocol", "testing", "quality", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.28,<1",
  "mcp[cli]>=1.27,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
mcp-qa-lab = "mcp_qa_lab.cli:main"

[project.urls]
Homepage = "https://github.com/efficjump/mcp-qa-lab"
Repository = "https://github.com/efficjump/mcp-qa-lab"
Issues = "https://github.com/efficjump/mcp-qa-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_qa_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["mcp_qa_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_qa_lab"]
